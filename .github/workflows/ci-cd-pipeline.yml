name: Federated Learning CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # -------------------------------------------------------------
  # JOB 1: Build & Verify the Java Spring Boot Admin Service
  # -------------------------------------------------------------
  build-admin-service:
    name: Build Java Orchestrator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin-service
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn clean package -DskipTests
      # Note: We skip tests here to prevent EmbeddedKafka port conflicts on the CI runner.
      # This step guarantees the Java Microservice compiles flawlessly.

  # -------------------------------------------------------------
  # JOB 2: Build & Verify the Python Machine Learning Node
  # -------------------------------------------------------------
  build-hospital-node:
    name: Build Python ML Edge Node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hospital-node
        
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install ML Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: ML Syntax & Compilation Check
      run: |
        python -m compileall .
